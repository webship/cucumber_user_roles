name: 'Cucumber Coordinator User Role Default'
description: 'Gives a site the Cucumber Coordinator user role and its Coordinator dashboard, turns the role on in the Cucumber User Roles settings, lets the Coordinator role work on features in the automated testing workflow, and lets the Admin role see that dashboard.'
type: install
install:
  # The parent module owns "cucumber_user_roles.settings", which the config
  # action below changes. Recipes validate that the extension behind a config
  # action is installed by the recipe itself, not only by the modules it pulls
  # in, so name it here. This module depends on it either way.
  - cucumber_user_roles
  - cucumber_user_role_coordinator
config:
  # Only create what a site does not have yet. Re-applying this recipe on a
  # site that already has this configuration is a no-op.
  strict: false
  import:
    # A recipe installs modules with the configuration installer in syncing
    # mode, which creates simple configuration but no configuration entities
    # (see \Drupal\Core\Recipe\RecipeRunner::installModules()). Import the
    # role and its dashboard here, so applying this recipe leaves the same
    # configuration behind as installing the module does.
    cucumber_user_role_coordinator: '*'
  actions:
    cucumber_user_roles.settings:
      simpleConfigUpdate:
        coordinator: true
    user.role.admin:
      # The Cucumber distribution ships an "admin" role. On a plain Drupal
      # site that role does not exist yet, so create it before granting
      # anything to it.
      createIfNotExists:
        label: Admin
        is_admin: false
      grantPermissions:
        - 'can view coordinator_dashboard dashboard'
    user.role.coordinator:
      # A coordinator distributes the work and follows it: the role moves a
      # feature through every step of the workflow, sees the drafts of the
      # team and keeps the feature directories.
      #
      # Granted here, after the role is imported and once the Gherkin text
      # format, the automated testing workflow and the feature directories
      # of Cucumber Core exist: a permission has to exist to be granted.
      grantPermissions:
        # The features, with their Gherkin scripts.
        - 'view media'
        - 'view own unpublished media'
        - 'view latest version'
        - 'use text format gherkin'
        - 'edit own feature media'
        - 'delete own feature media'
        - 'view any feature media revisions'
        # The browser that files a feature in a feature directory.
        - 'access media directories ui browser'
        - 'access media_directories_editor_browser entity browser pages'
        - 'access media_directories_modal entity browser pages'
        - 'access media_directories_overview entity browser pages'
        # The steps of the automated testing workflow this role takes. The
        # permissions carry the first names of the steps: back_to_draft
        # sends back to Draft, create_new_task moves to To Do, to_do moves
        # to In Progress, in_progress moves to Implemented and implemented
        # publishes.
        - 'use automated_testing transition back_to_draft'
        - 'use automated_testing transition create_new_task'
        - 'use automated_testing transition to_do'
        - 'use automated_testing transition in_progress'
        - 'use automated_testing transition implemented'
        # The drafts of the team, the team itself and the feature directories.
        - 'view any unpublished content'
        - 'access media overview'
        - 'access user profiles'
        - 'access taxonomy overview'
        - 'create terms in feature_directory'
        - 'edit terms in feature_directory'
        # The administration screens, in the administration theme.
        - 'view the administration theme'
